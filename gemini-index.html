<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>602 Racing Game</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Noto Sans TC",sans-serif;background:#eef4f8;color:#17212b}
  .app{max-width:1250px;margin:auto;padding:18px}
  h1{margin:0 0 4px;text-align:center;font-size:34px}
  .subtitle{text-align:center;color:#5d6b75;margin-bottom:14px}
  .layout{display:grid;grid-template-columns:1fr 310px;gap:16px}
  .board,.panel{background:#fff;border-radius:20px;box-shadow:0 8px 25px #00000012}
  .board{padding:14px}
  .track{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .cell{height:74px;border:2px solid #d7e0e6;border-radius:12px;background:#f8fbfd;position:relative;padding:5px;font-weight:800}
  .cell.start{background:#e8f6ec;border-color:#8bc79b}
  .cell.finish{background:#fff3d9;border-color:#e8b94d}
  .num{font-size:13px;color:#73808a}
  .cars{position:absolute;left:5px;right:5px;bottom:5px;display:flex;gap:2px;flex-wrap:wrap}
  .car{font-size:22px;line-height:1;filter:drop-shadow(0 2px 1px #0002);transition:transform .25s}
  .winner{animation:pop .65s infinite alternate}
  @keyframes pop{to{transform:scale(1.18) rotate(-3deg)}}
  .panel{padding:16px}
  .teams{display:grid;gap:6px}
  .team{border:2px solid #e1e7eb;border-radius:12px;padding:8px;background:#fbfcfd;cursor:pointer}
  .team.active{border-color:#222;box-shadow:0 0 0 3px #0000000b}
  .teamrow{display:flex;align-items:center;justify-content:space-between}
  .teamname{font-weight:900}.pos{font-size:13px;color:#64717a}
  .controls{margin-top:14px;display:grid;gap:8px}
  button{border:0;border-radius:12px;padding:11px 10px;font-size:16px;font-weight:800;cursor:pointer;background:#17212b;color:white}
  button:hover{transform:translateY(-1px)}
  .moveBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .moveBtns button{background:#3c6e91}
  .reset{background:#d85c5c}
  .status{text-align:center;margin:12px 0 8px;padding:10px;border-radius:12px;background:#f1f5f7;font-weight:800;min-height:42px}
  
  /* 歷史紀錄區樣式 */
  .log-container{background:#f8fbfd;border:1px solid #e1e7eb;border-radius:10px;padding:8px;max-height:110px;overflow-y:auto;font-size:12px;color:#5d6b75}
  .log-title{font-size:11px;color:#8a99ad;margin-bottom:4px;font-weight:bold;display:flex;justify-content:space-between}
  .log-item{padding:3px 0;border-bottom:1px solid #edf2f5}
  .log-item:last-child{border-bottom:none}

  .legend{font-size:13px;color:#68757e;line-height:1.5;margin-top:12px}
  @media(max-width:850px){.layout{grid-template-columns:1fr}.cell{height:62px}.car{font-size:18px}}
</style>
</head>
<body>
<div class="app">
  <h1>🏁 602 RACING GAME</h1>
  <div class="subtitle">36 格・6 組競速｜自動存檔紀錄，重新整理不遺失！</div>

  <div class="layout">
    <section class="board">
      <div id="track" class="track"></div>
    </section>

    <aside class="panel">
      <div class="teams" id="teams"></div>
      <div class="status" id="status">請選擇一組開始！</div>

      <div class="log-title">
        <span>📜 移動歷程 (自動儲存)</span>
      </div>
      <div class="log-container" id="logs">
        <div class="log-item">無歷史紀錄</div>
      </div>

      <div class="controls">
        <div class="moveBtns">
          <button onclick="moveSelected(1)">+1</button>
          <button onclick="moveSelected(2)">+2</button>
          <button onclick="moveSelected(3)">+3</button>
          <button onclick="moveSelected(4)">+4</button>
          <button onclick="moveSelected(5)">+5</button>
          <button onclick="moveSelected(6)">+6</button>
        </div>
        <button class="reset" onclick="resetGame()">🔄 NEW GAME (重置)</button>
      </div>

      <div class="legend">
        💡 <b>玩法：</b>點選隊伍後選擇前進格數 (+1 到 +6)。<br>
        ❓ 地圖上藏有神秘格，踩中會隨機前進或後退！<br>
        🏁 先到達 36 格的隊伍獲勝！
      </div>
    </aside>
  </div>
</div>

<script>
const emojis = ["🏎️","🚙","🚕","🚌","🚓","🚚"];
const names = ["Team 1","Team 2","Team 3","Team 4","Team 5","Team 6"];
const specialCells = [5, 9, 13, 17, 21, 24, 28, 31, 34];

let pos = [0,0,0,0,0,0];
let selected = 0;
let gameOver = false;
let logs = [];

// 專屬 602 的存檔 Key 名稱，與 601 獨立不衝突
const STORAGE_KEY = "602_racing_game_save";

// 載入 localStorage 存檔
function loadGameData(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try {
      const data = JSON.parse(saved);
      pos = data.pos || [0,0,0,0,0,0];
      selected = data.selected || 0;
      gameOver = data.gameOver || false;
      logs = data.logs || [];
    } catch(e) {
      console.error("存檔讀取失敗", e);
    }
  }
}

// 儲存資料至 localStorage
function saveGameData(){
  const data = {
    pos: pos,
    selected: selected,
    gameOver: gameOver,
    logs: logs
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// 紀錄與顯示歷史紀錄
function addLog(msg){
  const time = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
  logs.unshift(`[${time}] ${msg}`);
  if(logs.length > 20) logs.pop();
  renderLogs();
}

function renderLogs(){
  const container = document.getElementById("logs");
  if(logs.length === 0){
    container.innerHTML = '<div class="log-item">無歷史紀錄</div>';
    return;
  }
  container.innerHTML = logs.map(l => `<div class="log-item">${l}</div>`).join('');
}

function render(){
  const track = document.getElementById("track");
  track.innerHTML = "";
  
  let nums = [];
  for(let r=5; r>=0; r--){
    let row = Array.from({length:6}, (_,i) => r*6 + i + 1);
    if((5-r) % 2 === 1) row.reverse();
    nums.push(...row);
  }

  nums.forEach(n => {
    const c = document.createElement("div");
    c.className = "cell";
    if(n === 1) c.classList.add("start");
    if(n === 36) c.classList.add("finish");
    c.innerHTML = `<div class="num">${n===1 ? "START" : n===36 ? "🏁 FINISH" : "#"+n}</div>`;

    const cars = document.createElement("div");
    cars.className = "cars";
    pos.forEach((p, i) => {
      if(p === n) {
        const car = document.createElement("span");
        car.className = "car" + (p === 36 ? " winner" : "");
        car.textContent = emojis[i];
        cars.appendChild(car);
      }
    });
    c.appendChild(cars);
    track.appendChild(c);
  });

  const teams = document.getElementById("teams");
  teams.innerHTML = "";
  names.forEach((name, i) => {
    const d = document.createElement("div");
    d.className = "team" + (i === selected ? " active" : "");
    d.onclick = () => { 
      selected = i; 
      render(); 
      setStatus(`${names[i]} 已選取 🏎️`);
      saveGameData();
    };
    d.innerHTML = `<div class="teamrow"><span class="teamname">${emojis[i]} ${name}</span><span class="pos">${pos[i]}/36</span></div>`;
    teams.appendChild(d);
  });

  renderLogs();
}

function setStatus(t){ document.getElementById("status").textContent = t; }

function moveSelected(n){
  if(gameOver) return;
  const i = selected;
  const old = pos[i];
  let next = Math.min(36, old + n);
  pos[i] = next;
  
  let statusMsg = `${emojis[i]} ${names[i]} 前進 ${n} 格！(到達 ${next} 格)`;
  setStatus(statusMsg);
  addLog(statusMsg);

  if(specialCells.includes(next)){
    const isForward = Math.random() < 0.5;
    const randomSteps = Math.floor(Math.random() * 3) + 1;
    const delta = isForward ? randomSteps : -randomSteps;
    
    const after = Math.max(1, Math.min(36, next + delta));
    pos[i] = after;

    const specialMsg = delta > 0
      ? `🚀 幸運觸發神秘加速！額外前進 ${delta} 格 → 到達 ${after} 格`
      : `⚠️ 踩空觸發神秘減速！後退 ${Math.abs(delta)} 格 → 到達 ${after} 格`;

    setTimeout(() => {
      setStatus(specialMsg);
      addLog(`${names[i]} ${specialMsg}`);
      render();
      saveGameData();
    }, 300);
  }

  if(pos[i] === 36){
    gameOver = true;
    const winMsg = `🏆 ${names[i]} WIN! 抵達終點！`;
    setStatus(winMsg);
    addLog(winMsg);
  }

  render();
  saveGameData();
}

function resetGame(){
  if(confirm("確定要重置比賽嗎？進度與紀錄將會清空！")){
    pos = [0,0,0,0,0,0];
    selected = 0;
    gameOver = false;
    logs = [];
    localStorage.removeItem(STORAGE_KEY);
    render();
    setStatus("新比賽開始！請選擇一組 🏁");
  }
}

// 程式載入時先執行讀取
loadGameData();
render();
if(logs.length > 0){
  setStatus("已自動載入上次的比賽紀錄 🏁");
}
</script>
</body>
</html>
